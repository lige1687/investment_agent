[project]
name = "fund-investment-agent"
version = "0.1.0"
description = "Fund/ETF investment assistant with market monitoring and signal generation"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic-settings>=2.1",
    "pydantic>=2.5",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pandas>=2.1",
    "numpy>=1.24",
    "ta>=0.11",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "coverage>=7.4",
    "black>=24.0",
    "ruff>=0.3",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
